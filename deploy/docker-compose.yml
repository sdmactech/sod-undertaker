# SoD Undertaker on MFV. bin/deploy-nas.sh pushes a branch into ./app (v1, main), ./app-v2 (v2) or ./app-v3 (v3)
# and installs its Python packages into <slot>/.deps. No image is built: DSM's kernel has no
# seccomp, so build RUN steps fail, and running the stock image keeps every step on the
# passwordless `sudo docker` / `sudo docker-compose` the NAS already allows.
x-common: &common
  image: python:3.12-slim
  restart: unless-stopped
  working_dir: /app
  env_file: .env
  command: ["python", "-m", "gunicorn", "--bind", "0.0.0.0:5050", "--workers", "1", "--threads", "4", "wsgi:app"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  sod-undertaker:
    <<: *common
    container_name: sod-undertaker
    ports:
      - "8094:5050"
    environment:
      DATABASE_URL: sqlite:////data/undertaker.db
      PYTHONPATH: /app/.deps
    volumes:
      - ./app:/app:ro
      - ./data/v1:/data

  sod-undertaker-v2:
    <<: *common
    container_name: sod-undertaker-v2
    ports:
      - "8095:5050"
    environment:
      DATABASE_URL: sqlite:////data/undertaker.db
      PYTHONPATH: /app/.deps
    volumes:
      - ./app-v2:/app:ro
      - ./data/v2:/data

  sod-undertaker-v3:
    <<: *common
    container_name: sod-undertaker-v3
    ports:
      - "8096:5050"
    environment:
      DATABASE_URL: sqlite:////data/undertaker.db
      PYTHONPATH: /app/.deps
    volumes:
      - ./app-v3:/app:ro
      - ./data/v3:/data
